services:
  postgres:
    image: postgres:17-alpine
    container_name: plataforma-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: plataforma_hub
    ports:
      - '5442:5432'
    volumes:
      - hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hub -d plataforma_hub']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hub_pgdata:
