<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'"
    />
    <title>Plataforma Hub</title>
    <style>
      /* Identidade da Plataforma Hub: base branca, azul da marca no indicador. */
      :root {
        --brand-600: #1665f0;
        --brand-900: #0b2e75;
        --line: #e5eaf2;
        --muted: #526078;
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-app-region: drag;
      }

      .logo {
        width: 190px;
        height: auto;
      }

      .title {
        font-size: 15px;
        font-weight: 600;
        color: var(--brand-900);
      }

      .message {
        font-size: 13px;
        color: var(--muted);
      }

      .track {
        width: 190px;
        height: 3px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }

      /* Barra indeterminada: nao sabemos quanto o backend vai levar. */
      .bar {
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: var(--brand-600);
        animation: slide 1.25s ease-in-out infinite;
      }

      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bar {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <img class="logo" src="logo-hub.png" alt="Plataforma Hub" />
    <div class="track"><div class="bar"></div></div>
    <p class="message">Iniciando sua operacao...</p>
  </body>
</html>
